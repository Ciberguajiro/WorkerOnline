version: '3.8'

services:
  web-terminal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: web-terminal
    ports:
      - "3000:3000"
    environment:
      # API Keys for AI tools (set in .env file or pass directly)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PORT=3000
      # Git identity for commits inside the terminal
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
    volumes:
      # Workspace for repositories (persistent on host)
      - ./workspace:/workspace
      # SSH keys and configuration persistence
      - ssh:/root/.ssh
      # Cache for tools and npm/bun
      - cache:/root/.cache
      # npm global config and packages persistence
      - npm-global:/root/.npm-global
      # Bun cache persistence
      - bun-cache:/root/.bun/install/cache
      # Claude Code sessions, auth token, and config persistence
      - claude-data:/root/.claude
      # OpenCode binary + sessions persistence
      - opencode-data:/root/.opencode
      # XDG config dir (opencode and other tools store config here)
      - xdg-config:/root/.config
    working_dir: /workspace
    # Keep container running and interactive
    tty: true
    stdin_open: true
    # Restart policy
    restart: unless-stopped
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ssh:
    driver: local
  cache:
    driver: local
  npm-global:
    driver: local
  bun-cache:
    driver: local
  claude-data:
    driver: local
  opencode-data:
    driver: local
  xdg-config:
    driver: local
